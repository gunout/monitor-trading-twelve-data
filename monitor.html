<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 TRADING MONITOR - Twelve Data</title>
    <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            color: #33ff33;
            font-family: 'VT323', 'Courier New', monospace;
            padding: 10px;
            min-height: 100vh;
        }
        .container {
            max-width: 1600px;
            margin: 0 auto;
            border: 2px solid #33ff33;
            padding: 12px;
            background: #0a0a0a;
        }
        .header {
            border-bottom: 2px solid #33ff33;
            padding-bottom: 10px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .title {
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 4px;
        }
        .title .blink { animation: blink 1s infinite; }
        @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
        .title .ind-color { color: #ff6b00; }
        .title .ia-color { color: #00ccff; }
        .title .td-color { color: #00ff88; }

        .tabs {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin-bottom: 12px;
            border-bottom: 1px solid #33ff33;
            padding-bottom: 8px;
        }
        .tab {
            padding: 6px 16px;
            border: 1px solid #33ff33;
            background: transparent;
            color: #33ff33;
            cursor: pointer;
            font-family: 'VT323', monospace;
            font-size: 0.8rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .tab:hover { background: rgba(51,255,51,0.1); }
        .tab.active { background: rgba(51,255,51,0.15); border-color: #33ff33; }
        .tab .icon { margin-right: 4px; }

        .main-grid { display: grid; grid-template-columns: 2.5fr 1fr; gap: 12px; }
        .card { border: 1px solid #33ff33; padding: 10px; margin-bottom: 10px; background: rgba(51,255,51,0.02); }
        .card-title { font-size: 0.9rem; font-weight: bold; border-bottom: 1px solid #33ff33; padding-bottom: 4px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 4px; }

        .price-display { text-align: center; padding: 15px; border: 1px solid #33ff33; position: relative; }
        .price { font-size: 2.8rem; font-weight: bold; text-shadow: 0 0 30px rgba(51,255,51,0.1); }
        .change-positive { color: #33ff33; }
        .change-negative { color: #ff3333; }

        .chart-controls {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin-bottom: 8px;
            padding: 4px;
            background: rgba(51,255,51,0.03);
            border: 1px solid #33ff33;
        }
        .chart-controls .group {
            display: flex;
            gap: 2px;
            align-items: center;
            padding: 0 6px;
            border-right: 1px solid rgba(51,255,51,0.3);
        }
        .chart-controls .group:last-child { border-right: none; }
        .chart-controls .group-label {
            font-size: 0.55rem;
            text-transform: uppercase;
            opacity: 0.5;
            margin-right: 4px;
            white-space: nowrap;
        }
        .chart-controls button {
            background: transparent;
            border: 1px solid #33ff33;
            color: #33ff33;
            padding: 2px 8px;
            font-family: 'VT323', monospace;
            font-size: 0.65rem;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .chart-controls button:hover { background: rgba(51,255,51,0.1); }
        .chart-controls button.active { background: rgba(51,255,51,0.2); }
        .chart-controls button.indicator-btn { border-color: #ff6b00; color: #ff6b00; }
        .chart-controls button.indicator-btn.active { background: rgba(255,107,0,0.2); }

        .input-group { display: flex; gap: 6px; margin: 6px 0; }
        .input-group input {
            flex: 1;
            background: transparent;
            border: 1px solid #33ff33;
            color: #33ff33;
            padding: 4px 8px;
            font-family: 'VT323', monospace;
            font-size: 0.9rem;
        }
        .input-group input:focus { outline: none; background: rgba(51,255,51,0.05); }
        .btn {
            background: transparent;
            border: 1px solid #33ff33;
            color: #33ff33;
            padding: 4px 12px;
            font-family: 'VT323', monospace;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn:hover { background: rgba(51,255,51,0.1); }
        .btn-sm { padding: 2px 8px; font-size: 0.65rem; }
        .btn-export { border-color: #4CAF50; color: #4CAF50; }
        .btn-compare { border-color: #9C27B0; color: #9C27B0; }
        .btn-prefs { border-color: #FF9800; color: #FF9800; }
        .quick-buttons { display: flex; gap: 3px; flex-wrap: wrap; margin-top: 4px; }

        .watchlist-item {
            display: flex;
            justify-content: space-between;
            padding: 4px 8px;
            border: 1px solid #33ff33;
            cursor: pointer;
            margin-bottom: 2px;
            background: rgba(51,255,51,0.02);
            transition: all 0.2s;
            font-size: 0.85rem;
        }
        .watchlist-item:hover { background: rgba(51,255,51,0.08); }
        .watchlist-item .icon { margin-right: 6px; }
        .watchlist-grid { max-height: 250px; overflow-y: auto; }
        .watchlist-grid::-webkit-scrollbar { width: 4px; }
        .watchlist-grid::-webkit-scrollbar-thumb { background: #33ff33; }

        .indicators-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
        }
        .indicator-box {
            border: 1px solid #33ff33;
            padding: 6px 8px;
            text-align: center;
            background: rgba(51,255,51,0.02);
            border-radius: 4px;
        }
        .indicator-box .name {
            font-size: 0.5rem;
            text-transform: uppercase;
            opacity: 0.6;
            letter-spacing: 1px;
        }
        .indicator-box .value {
            font-size: 1rem;
            font-weight: bold;
            margin-top: 2px;
        }
        .indicator-box .sub-value {
            font-size: 0.7rem;
            opacity: 0.7;
        }
        .indicator-box .value.bullish { color: #33ff33; }
        .indicator-box .value.bearish { color: #ff3333; }
        .indicator-box .value.neutral { color: #ffaa00; }

        .signal-box {
            border: 1px solid #33ff33;
            padding: 4px 8px;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-radius: 4px;
        }
        .signal-buy { border-color: #33ff33; background: rgba(51,255,51,0.05); }
        .signal-sell { border-color: #ff3333; background: rgba(255,51,51,0.05); }
        .signal-neutral { border-color: #ffaa00; background: rgba(255,170,0,0.05); }
        .signal-box .signal-icon { font-size: 1.2rem; }
        .signal-box .signal-content { flex: 1; }
        .signal-box .signal-content .signal-title { font-weight: bold; font-size: 0.8rem; }
        .signal-box .signal-content .signal-text { font-size: 0.7rem; opacity: 0.7; }

        .recommendation-box {
            border: 2px solid #33ff33;
            padding: 10px;
            text-align: center;
            margin-top: 8px;
            border-radius: 4px;
        }
        .recommendation-buy { border-color: #33ff33; background: rgba(51,255,51,0.05); }
        .recommendation-sell { border-color: #ff3333; background: rgba(255,51,51,0.05); }
        .recommendation-neutral { border-color: #ffaa00; background: rgba(255,170,0,0.05); }
        .recommendation-box .rec-title { font-size: 1.5rem; font-weight: bold; }
        .recommendation-box .rec-confidence { font-size: 0.8rem; opacity: 0.7; }

        .prediction-grid { display: grid; grid-template-columns: repeat(5,1fr); gap: 4px; margin-top: 6px; }
        .prediction-item { text-align: center; padding: 4px; border: 1px solid #33ff33; background: rgba(51,255,51,0.02); border-radius: 4px; }
        .prediction-item .day { font-size: 0.5rem; text-transform: uppercase; opacity: 0.6; }
        .prediction-item .price { font-weight: bold; font-size: 0.8rem; }

        .footer {
            border-top: 2px solid #33ff33;
            padding-top: 8px;
            margin-top: 12px;
            text-align: center;
            font-size: 0.7rem;
            opacity: 0.6;
        }

        .price-info {
            display: flex;
            justify-content: center;
            gap: 15px;
            font-size: 0.8rem;
            opacity: 0.7;
            margin-top: 6px;
            flex-wrap: wrap;
        }
        .price-info span { display: flex; align-items: center; gap: 4px; }

        .badge {
            padding: 2px 8px;
            border: 1px solid #33ff33;
            font-size: 0.6rem;
            background: rgba(51,255,51,0.05);
            border-radius: 4px;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .signal-count {
            font-size: 0.6rem;
            padding: 1px 8px;
            border-radius: 10px;
            background: rgba(51,255,51,0.1);
        }
        .signal-count.buy { background: rgba(51,255,51,0.2); color: #33ff33; }
        .signal-count.sell { background: rgba(255,51,51,0.2); color: #ff3333; }

        .compare-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .compare-modal.active { display: flex; }
        .compare-modal-content {
            background: #0a0a0a;
            border: 2px solid #33ff33;
            padding: 20px;
            max-width: 800px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            border-radius: 8px;
        }
        .compare-modal-content .close-btn {
            float: right;
            background: none;
            border: none;
            color: #33ff33;
            font-size: 1.5rem;
            cursor: pointer;
        }
        .compare-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }
        .compare-card {
            border: 1px solid #33ff33;
            padding: 10px;
            text-align: center;
            border-radius: 4px;
        }
        .compare-card .perf-positive { color: #33ff33; }
        .compare-card .perf-negative { color: #ff3333; }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #0a0a0a;
            border: 2px solid #33ff33;
            padding: 15px 20px;
            border-radius: 8px;
            z-index: 2000;
            max-width: 350px;
            animation: slideIn 0.5s ease;
            box-shadow: 0 0 30px rgba(51,255,51,0.1);
        }
        .notification .notif-title { font-size: 1.2rem; font-weight: bold; }
        .notification .notif-close {
            position: absolute;
            top: 5px;
            right: 10px;
            background: none;
            border: none;
            color: #33ff33;
            cursor: pointer;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .ia-prob-container {
            margin-top: 8px;
            padding: 6px;
            border: 1px solid rgba(51,255,51,0.2);
            border-radius: 4px;
        }
        .ia-prob-bar {
            display: flex;
            height: 16px;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 4px;
            border: 1px solid #33ff33;
        }
        .ia-prob-bar .bar {
            height: 100%;
            transition: width 0.5s ease;
        }
        .ia-prob-bar .bar-sell { background: #ff3333; }
        .ia-prob-bar .bar-neutral { background: #ffaa00; }
        .ia-prob-bar .bar-buy { background: #33ff33; }
        .ia-prob-legend {
            display: flex;
            justify-content: space-between;
            font-size: 0.5rem;
            margin-top: 2px;
            opacity: 0.7;
        }

        .ia-status {
            font-size: 0.6rem;
            opacity: 0.5;
            margin-top: 4px;
            text-align: center;
        }

        .loading-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10,10,10,0.9);
            z-index: 100;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 15px;
            border-radius: 4px;
        }
        .loading-overlay.active { display: flex; }
        .loading-overlay .loader-big {
            width: 50px;
            height: 50px;
            border: 3px solid #33ff33;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-overlay .loading-text {
            font-size: 1.2rem;
            color: #33ff33;
            letter-spacing: 2px;
        }
        .loading-overlay .loading-sub {
            font-size: 0.8rem;
            color: #33ff33;
            opacity: 0.6;
        }

        .realtime-badge {
            border: 1px solid #00ff88;
            color: #00ff88;
            padding: 2px 8px;
            font-size: 0.6rem;
            border-radius: 4px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @media (max-width: 1200px) { .main-grid { grid-template-columns: 1fr; } }
        @media (max-width: 768px) {
            .title { font-size: 1.5rem; }
            .indicators-grid { grid-template-columns: 1fr 1fr; }
            .price { font-size: 2rem; }
            .prediction-grid { grid-template-columns: repeat(3,1fr); }
            .tabs .tab { font-size: 0.6rem; padding: 4px 8px; }
        }
        @media (max-width: 480px) {
            .price { font-size: 1.5rem; }
            .indicators-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <div class="title">
                    📊 TRADING MONITOR <span class="ind-color">IND</span> + <span class="ia-color">IA</span> + <span class="td-color">LIVE</span> <span class="blink">▸</span>
                    <span style="font-size:0.7rem;opacity:0.4;letter-spacing:2px;display:block;margin-top:-4px;">
                        <i class="fas fa-bolt" style="color:#00ff88;"></i> TWELVE DATA REALTIME
                    </span>
                </div>
            </div>
            <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
                <button class="btn btn-sm btn-prefs" onclick="savePrefs()"><i class="fas fa-save"></i> Prefs</button>
                <button class="btn btn-sm btn-export" onclick="exportCSV()"><i class="fas fa-file-csv"></i> CSV</button>
                <button class="btn btn-sm btn-compare" onclick="openCompare()"><i class="fas fa-chart-bar"></i> Comparer</button>
                <span class="realtime-badge"><i class="fas fa-circle" style="color:#00ff88;font-size:0.5rem;"></i> LIVE</span>
                <span id="status" style="border:1px solid #33ff33;padding:4px 12px;">CHARGEMENT...</span>
            </div>
        </div>

        <div class="tabs" id="tabs">
            <button class="tab active" data-tab="commodities"><span class="icon">🛢️</span>Commodites</button>
            <button class="tab" data-tab="crypto"><span class="icon">₿</span>Crypto</button>
            <button class="tab" data-tab="forex"><span class="icon">💱</span>Forex</button>
            <button class="tab" data-tab="usstocks"><span class="icon">🇺🇸</span>US Stocks</button>
            <button class="tab" data-tab="paris"><span class="icon">🇫🇷</span>Paris</button>
            <button class="tab" data-tab="indices"><span class="icon">📈</span>INDICES</button>
            <button class="tab" data-tab="funds"><span class="icon">📊</span>FUNDS</button>
        </div>

        <div id="tab-contents">
            <div class="tab-content active" id="tab-commodities"><div class="main-grid" id="tab-grid-commodities"></div></div>
            <div class="tab-content" id="tab-crypto"><div class="main-grid" id="tab-grid-crypto"></div></div>
            <div class="tab-content" id="tab-forex"><div class="main-grid" id="tab-grid-forex"></div></div>
            <div class="tab-content" id="tab-usstocks"><div class="main-grid" id="tab-grid-usstocks"></div></div>
            <div class="tab-content" id="tab-paris"><div class="main-grid" id="tab-grid-paris"></div></div>
            <div class="tab-content" id="tab-indices"><div class="main-grid" id="tab-grid-indices"></div></div>
            <div class="tab-content" id="tab-funds"><div class="main-grid" id="tab-grid-funds"></div></div>
        </div>

        <div class="footer">
            TRADING MONITOR v9.0 • Twelve Data Realtime • Cache intelligent • Export CSV
        </div>
    </div>

    <div class="compare-modal" id="compare-modal">
        <div class="compare-modal-content">
            <button class="close-btn" onclick="closeCompare()">✕</button>
            <h2 style="color:#33ff33;margin-bottom:10px;">Comparaison d'actifs</h2>
            <div class="input-group" style="margin-bottom:10px;">
                <input type="text" id="compare-input" placeholder="AAPL,MSFT,BTC-USD" value="AAPL,MSFT,BTC-USD">
                <button class="btn" onclick="runCompare()"><i class="fas fa-play"></i></button>
            </div>
            <div id="compare-results">
                <div style="opacity:0.5;text-align:center;padding:20px;">Entrez les symboles separes par des virgules</div>
            </div>
        </div>
    </div>

    <script>
        // ================================================================
        // CONFIGURATION
        // ================================================================
        var API_BASE = window.location.origin;
        var currentSymbol = 'GLD';
        var currentPeriod = '1d';
        var chartType = 'candle';
        var candlesData = [];
        var currentTab = 'commodities';
        var loadingTimeouts = {};

        var activeIndicators = {
            sma: true, ema: false, bb: false, volume: false
        };

        var categorySymbols = {
            'commodities': ['GLD', 'SLV', 'USO'],
            'crypto': ['BTC-USD', 'ETH-USD', 'SOL-USD'],
            'forex': ['EURUSD=X', 'GBPUSD=X', 'USDJPY=X'],
            'usstocks': ['AAPL', 'MSFT', 'GOOGL', 'NVDA', 'TSLA', 'AMZN', 'META', 'JPM'],
            'paris': ['ML.PA', 'SAN.PA', 'OR.PA', 'AI.PA'],
            'indices': ['^GSPC', '^DJI', '^IXIC', '^FCHI', '^GDAXI', '^N225', '^FTSE'],
            'funds': ['SPY', 'QQQ', 'DIA']
        };

        var defaultSymbols = {
            'commodities': 'GLD',
            'crypto': 'BTC-USD',
            'forex': 'EURUSD=X',
            'usstocks': 'AAPL',
            'paris': 'ML.PA',
            'indices': '^GSPC',
            'funds': 'SPY'
        };

        var categoryNames = {
            'commodities': 'Commodites',
            'crypto': 'Crypto',
            'forex': 'Forex',
            'usstocks': 'US Stocks',
            'paris': 'Paris Stocks',
            'indices': 'INDICES',
            'funds': 'FUNDS'
        };

        // ================================================================
        // FETCH AVEC TIMEOUT LONG (90s)
        // ================================================================
        function fetchWithTimeout(url, timeout) {
            timeout = timeout || 90000;
            return new Promise(function(resolve, reject) {
                var controller = new AbortController();
                var timeoutId = setTimeout(function() {
                    controller.abort();
                    reject(new Error('Timeout ' + (timeout/1000) + 's'));
                }, timeout);

                fetch(url, { signal: controller.signal })
                    .then(function(response) {
                        clearTimeout(timeoutId);
                        if (!response.ok) {
                            reject(new Error('HTTP ' + response.status));
                            return;
                        }
                        return response.json();
                    })
                    .then(function(data) { resolve(data); })
                    .catch(function(err) {
                        clearTimeout(timeoutId);
                        reject(err);
                    });
            });
        }

        // ================================================================
        // NOTIFICATIONS
        // ================================================================
        function showNotification(message, icon) {
            var container = document.getElementById('notif-container');
            if (!container) {
                container = document.createElement('div');
                container.id = 'notif-container';
                container.style.position = 'fixed';
                container.style.top = '20px';
                container.style.right = '20px';
                container.style.zIndex = '2000';
                document.body.appendChild(container);
            }
            var notif = document.createElement('div');
            notif.className = 'notification';
            notif.innerHTML = '<button class="notif-close" onclick="this.parentElement.remove()">✕</button>' +
                '<div class="notif-title">' + (icon || '📢') + ' ' + message + '</div>';
            container.appendChild(notif);
            setTimeout(function() { if (notif.parentElement) notif.remove(); }, 5000);
        }

        function savePrefs() {
            try {
                localStorage.setItem('trading_monitor_prefs', JSON.stringify({
                    favorite_symbol: currentSymbol,
                    indicators: activeIndicators,
                    saved_at: new Date().toISOString()
                }));
                showNotification('Preferences sauvegardees', '💾');
            } catch(e) {}
        }

        function loadPrefs() {
            try {
                var prefs = JSON.parse(localStorage.getItem('trading_monitor_prefs'));
                if (prefs && prefs.indicators) {
                    for (var key in prefs.indicators) {
                        if (activeIndicators.hasOwnProperty(key)) {
                            activeIndicators[key] = prefs.indicators[key];
                        }
                    }
                }
            } catch(e) {}
        }

        function exportCSV() {
            window.open(API_BASE + '/api/export-csv/' + encodeURIComponent(currentSymbol), '_blank');
            showNotification('Export CSV pour ' + currentSymbol, '📊');
        }

        // ================================================================
        // COMPARAISON
        // ================================================================
        function openCompare() { document.getElementById('compare-modal').classList.add('active'); }
        function closeCompare() { document.getElementById('compare-modal').classList.remove('active'); }

        function runCompare() {
            var input = document.getElementById('compare-input').value.trim();
            if (!input) return;
            var symbols = input.split(',').map(function(s) { return s.trim(); }).filter(function(s) { return s; });
            if (symbols.length < 2) {
                document.getElementById('compare-results').innerHTML = '<div style="color:#ff3333;">Au moins 2 symboles</div>';
                return;
            }
            document.getElementById('compare-results').innerHTML = '<div style="opacity:0.5;text-align:center;padding:20px;">Chargement (peut prendre 1-2 min)...</div>';

            fetchWithTimeout(API_BASE + '/api/compare?symbols=' + encodeURIComponent(symbols.join(',')), 180000)
                .then(function(data) {
                    if (data.error || !data || data.length === 0) {
                        document.getElementById('compare-results').innerHTML = '<div style="color:#ff3333;">' + (data.error || 'Aucune donnee') + '</div>';
                        return;
                    }
                    var html = '<div class="compare-grid">';
                    data.forEach(function(item) {
                        var perfCls = item.performance >= 0 ? 'perf-positive' : 'perf-negative';
                        var perfSign = item.performance >= 0 ? '+' : '';
                        html += '<div class="compare-card" style="border-color:' + (item.color || '#33ff33') + ';">';
                        html += '<div style="font-size:1.5rem;">' + (item.icon || '📈') + '</div>';
                        html += '<div style="font-weight:bold;">' + item.symbol + '</div>';
                        html += '<div style="font-size:0.7rem;opacity:0.5;">' + (item.name || '') + '</div>';
                        html += '<div style="font-size:1.1rem;margin:4px 0;">$' + item.current_price.toFixed(2) + '</div>';
                        html += '<div class="' + perfCls + '">' + perfSign + item.performance.toFixed(2) + '%</div>';
                        html += '<div style="font-size:0.6rem;opacity:0.5;">Vol: ' + item.volatility.toFixed(1) + '%</div>';
                        html += '</div>';
                    });
                    html += '</div>';
                    document.getElementById('compare-results').innerHTML = html;
                })
                .catch(function(err) {
                    document.getElementById('compare-results').innerHTML = '<div style="color:#ff3333;">' + err.message + '</div>';
                });

        // ================================================================
        // TABS
        // ================================================================
        function initTabs() {
            document.querySelectorAll('.tab').forEach(function(tab) {
                tab.addEventListener('click', function() {
                    switchTab(this.dataset.tab);
                });
            });
        }

        function switchTab(tabId) {
            currentTab = tabId;
            document.querySelectorAll('.tab').forEach(function(t) {
                t.classList.toggle('active', t.dataset.tab === tabId);
            });
            document.querySelectorAll('.tab-content').forEach(function(c) {
                c.classList.toggle('active', c.id === 'tab-' + tabId);
            });
            loadQuickButtons(tabId);
            var input = document.getElementById('symbol-input-' + tabId);
            if (input) input.value = defaultSymbols[tabId] || 'GLD';
            fetchDataForTab(tabId);
            refreshWatchlist(tabId);
        }

        // ================================================================
        // FETCH DATA - UN SEUL APPEL
        // ================================================================
        function fetchDataForTab(category) {
            var input = document.getElementById('symbol-input-' + category);
            if (!input) return;
            var sym = input.value.trim() || defaultSymbols[category] || 'GLD';
            currentSymbol = sym;
            var prefix = '-' + category;

            var loadingEl = document.getElementById('loading-' + category);
            if (loadingEl) loadingEl.classList.add('active');

            var statusEl = document.getElementById('status');
            if (statusEl) {
                statusEl.textContent = 'CHARGEMENT...';
                statusEl.style.borderColor = '#33ff33';
            }

            if (loadingTimeouts[category]) clearTimeout(loadingTimeouts[category]);

            function hideLoader() {
                if (loadingEl) loadingEl.classList.remove('active');
                if (loadingTimeouts[category]) {
                    clearTimeout(loadingTimeouts[category]);
                    loadingTimeouts[category] = null;
                }
            }

            // UN SEUL APPEL API avec timeout 90s
            fetchWithTimeout(API_BASE + '/api/trading/' + encodeURIComponent(sym), 90000)
                .then(function(tradingData) {
                    hideLoader();

                    if (!tradingData || tradingData.error) {
                        if (statusEl) {
                            statusEl.textContent = 'ERREUR: ' + (tradingData.error || 'Inconnue');
                            statusEl.style.borderColor = '#ff3333';
                        }
                        return;
                    }

                    if (tradingData.data && Object.keys(tradingData.data).length > 0) {
                        updateDisplay(tradingData, category);
                        updateChart(tradingData, category);
                        updateIndicators(tradingData, category);
                    }

                    if (tradingData.indicators) {
                        updateAIInsights(tradingData, category);
                    }

                    if (tradingData.fundamental) {
                        updateFundamentalDisplay(tradingData.fundamental, category);
                    }

                    if (statusEl) {
                        statusEl.textContent = 'LIVE';
                        statusEl.style.borderColor = '#00ff88';
                    }

                    var updateEl = document.getElementById('last-update' + prefix);
                    if (updateEl) updateEl.textContent = new Date().toLocaleTimeString('fr-FR');

                    try {
                        var prefs = JSON.parse(localStorage.getItem('trading_monitor_prefs') || '{}');
                        prefs.favorite_symbol = sym;
                        localStorage.setItem('trading_monitor_prefs', JSON.stringify(prefs));
                    } catch(e) {}
                })
                .catch(function(err) {
                    hideLoader();
                    console.error('Erreur:', err);
                    if (statusEl) {
                        statusEl.textContent = 'ERREUR: ' + err.message;
                        statusEl.style.borderColor = '#ff3333';
                    }
                });

            loadingTimeouts[category] = setTimeout(function() {
                hideLoader();
                console.warn('Timeout securite ' + category);
            }, 100000);
        }

        // ================================================================
        // UPDATE DISPLAY
        // ================================================================
        function updateDisplay(data, category) {
            var pd = data.data[currentPeriod] || data.data['1d'] || data.data['5d'];
            if (!pd) return;
            var st = pd.stats;
            var prefix = '-' + category;
            var el;

            el = document.getElementById('current-symbol' + prefix);
            if (el) el.textContent = data.symbol;
            el = document.getElementById('current-exchange' + prefix);
            if (el) el.textContent = data.exchange || 'Market';
            el = document.getElementById('current-category' + prefix);
            if (el) el.textContent = data.category || 'Autre';
            el = document.getElementById('current-price' + prefix);
            if (el) el.textContent = '$' + st.current_price.toFixed(2);

            var cls = st.change >= 0 ? 'change-positive' : 'change-negative';
            var sign = st.change >= 0 ? '+' : '';
            el = document.getElementById('current-change' + prefix);
            if (el) el.innerHTML = '<span class="' + cls + '">' + sign + st.change_percent.toFixed(2) + '% (' + sign + st.change.toFixed(2) + ')</span>';

            el = document.getElementById('day-high' + prefix);
            if (el) el.textContent = '$' + st.high.toFixed(2);
            el = document.getElementById('day-low' + prefix);
            if (el) el.textContent = '$' + st.low.toFixed(2);

            var vol = st.volume;
            if (vol > 1000000) vol = (vol/1000000).toFixed(1) + 'M';
            else if (vol > 1000) vol = (vol/1000).toFixed(1) + 'K';
            el = document.getElementById('volume' + prefix);
            if (el) el.textContent = vol;
        }

        // ================================================================
        // UPDATE INDICATEURS
        // ================================================================
        function updateIndicators(data, category) {
            var pd = data.data[currentPeriod] || data.data['1d'] || data.data['5d'];
            if (!pd || !pd.indicators) return;
            var ind = pd.indicators;
            var prefix = '-' + category;

            var rsiVal = ind.last_rsi;
            var rsiEl = document.getElementById('ind-rsi' + prefix);
            if (rsiEl) {
                rsiEl.textContent = rsiVal != null ? rsiVal.toFixed(1) : '--';
                rsiEl.className = 'value ' + (rsiVal > 70 ? 'bearish' : rsiVal < 30 ? 'bullish' : 'neutral');
            }
            var rsiStatus = document.getElementById('ind-rsi-status' + prefix);
            if (rsiStatus) {
                rsiStatus.textContent = rsiVal > 70 ? 'Surachat' : rsiVal < 30 ? 'Survente' : 'Neutre';
                rsiStatus.style.color = rsiVal > 70 ? '#ff3333' : rsiVal < 30 ? '#33ff33' : '#ffaa00';
            }

            var macdVal = ind.last_macd, macdSig = ind.last_macd_signal;
            var macdEl = document.getElementById('ind-macd' + prefix);
            if (macdEl) {
                macdEl.textContent = macdVal != null ? macdVal.toFixed(3) : '--';
                macdEl.className = 'value ' + (macdVal > macdSig ? 'bullish' : macdVal < macdSig ? 'bearish' : 'neutral');
            }
            var macdStatus = document.getElementById('ind-macd-status' + prefix);
            if (macdStatus) {
                macdStatus.textContent = macdVal > macdSig ? 'HAUSSIER' : macdVal < macdSig ? 'BAISSIER' : 'NEUTRE';
                macdStatus.style.color = macdVal > macdSig ? '#33ff33' : macdVal < macdSig ? '#ff3333' : '#ffaa00';
            }

            var volVal = ind.volatility;
            var volEl = document.getElementById('ind-volatility' + prefix);
            if (volEl) {
                volEl.textContent = volVal != null ? volVal.toFixed(1) + '%' : '--';
                volEl.className = 'value ' + (volVal > 50 ? 'bearish' : volVal < 15 ? 'bullish' : 'neutral');
            }
            var volStatus = document.getElementById('ind-volatility-status' + prefix);
            if (volStatus) {
                volStatus.textContent = volVal > 50 ? 'Elevee' : volVal < 15 ? 'Faible' : 'Moyenne';
                volStatus.style.color = volVal > 50 ? '#ff3333' : volVal < 15 ? '#33ff33' : '#ffaa00';
            }

            var el;
            el = document.getElementById('ind-sma20' + prefix);
            if (el) el.textContent = ind.last_sma_20 != null ? '$' + ind.last_sma_20.toFixed(2) : '--';
            el = document.getElementById('ind-sma50' + prefix);
            if (el) el.textContent = ind.last_sma_50 != null ? '$' + ind.last_sma_50.toFixed(2) : '--';
            el = document.getElementById('ind-sma200' + prefix);
            if (el) el.textContent = ind.last_sma_200 != null ? '$' + ind.last_sma_200.toFixed(2) : '--';
            el = document.getElementById('ind-bb-upper' + prefix);
            if (el) el.textContent = ind.last_bb_upper != null ? '$' + ind.last_bb_upper.toFixed(2) : '--';
            el = document.getElementById('ind-bb-lower' + prefix);
            if (el) el.textContent = ind.last_bb_lower != null ? '$' + ind.last_bb_lower.toFixed(2) : '--';
            el = document.getElementById('ind-stoch-k' + prefix);
            if (el) el.textContent = ind.last_stoch_k != null ? ind.last_stoch_k.toFixed(1) : '--';
            el = document.getElementById('ind-stoch-d' + prefix);
            if (el) el.textContent = ind.last_stoch_d != null ? ind.last_stoch_d.toFixed(1) : '--';

            var momVal = ind.momentum;
            var momEl = document.getElementById('ind-momentum' + prefix);
            if (momEl) {
                momEl.textContent = momVal != null ? (momVal >= 0 ? '+' : '') + momVal.toFixed(1) + '%' : '--';
                momEl.className = 'value ' + (momVal > 5 ? 'bullish' : momVal < -5 ? 'bearish' : 'neutral');
            }

            el = document.getElementById('ind-time' + prefix);
            if (el) el.textContent = new Date().toLocaleTimeString('fr-FR');
        }

        // ================================================================
        // UPDATE FONDAMENTALES
        // ================================================================
        function updateFundamentalDisplay(fund, category) {
            var prefix = '-' + category;
            var el;

            el = document.getElementById('fund-sector' + prefix);
            if (el) el.textContent = fund.sector || 'N/A';
            el = document.getElementById('fund-industry' + prefix);
            if (el) el.textContent = fund.industry || 'N/A';

            var pe = fund.pe_ratio;
            el = document.getElementById('fund-pe' + prefix);
            if (el) {
                el.textContent = (pe !== 'N/A' && pe != null && pe !== 0) ? parseFloat(pe).toFixed(2) : 'N/A';
                el.className = 'value ' + (pe < 15 && pe > 0 ? 'bullish' : pe > 30 ? 'bearish' : 'neutral');
            }

            var div = fund.dividend_yield;
            el = document.getElementById('fund-dividend' + prefix);
            if (el) el.textContent = (div !== 'N/A' && div != null && div > 0) ? (div * 100).toFixed(2) + '%' : 'N/A';

            var mcap = fund.market_cap;
            el = document.getElementById('fund-mcap' + prefix);
            if (el) {
                if (mcap !== 'N/A' && mcap != null && mcap > 0) {
                    if (mcap >= 1e12) el.textContent = (mcap / 1e12).toFixed(2) + ' T$';
                    else if (mcap >= 1e9) el.textContent = (mcap / 1e9).toFixed(2) + ' Md$';
                    else if (mcap >= 1e6) el.textContent = (mcap / 1e6).toFixed(2) + ' M$';
                    else el.textContent = mcap.toFixed(0) + '$';
                } else el.textContent = 'N/A';
            }

            var beta = fund.beta;
            el = document.getElementById('fund-beta' + prefix);
            if (el) {
                el.textContent = (beta !== 'N/A' && beta != null) ? parseFloat(beta).toFixed(2) : 'N/A';
                el.className = 'value ' + (beta > 1.5 ? 'bearish' : beta < 0.8 && beta > 0 ? 'bullish' : 'neutral');
            }
        }

        // ================================================================
        // UPDATE IA INSIGHTS
        // ================================================================
        function updateAIInsights(data, category) {
            if (!data) return;
            var prefix = '-' + category;

            var probContainer = document.getElementById('ia-prob' + prefix);
            if (probContainer && data.ia_probabilities) {
                probContainer.style.display = 'block';
                var probs = data.ia_probabilities;
                var sellBar = document.getElementById('ia-bar-sell' + prefix);
                var neutralBar = document.getElementById('ia-bar-neutral' + prefix);
                var buyBar = document.getElementById('ia-bar-buy' + prefix);
                if (sellBar) sellBar.style.width = probs.vente + '%';
                if (neutralBar) neutralBar.style.width = probs.neutre + '%';
                if (buyBar) buyBar.style.width = probs.achat + '%';
            }

            var statusEl = document.getElementById('ia-status' + prefix);
            if (statusEl && data.ia_recommendation) {
                var rec = data.ia_recommendation;
                var emoji = rec === 'ACHAT' ? '🟢' : rec === 'VENTE' ? '🔴' : '🟡';
                statusEl.textContent = 'IA: ' + emoji + ' ' + rec + ' (' + (data.ia_confidence || 50).toFixed(0) + '%)';
            }

            var scoreEl = document.getElementById('ia-score' + prefix);
            if (scoreEl) {
                var score = data.score || 0;
                scoreEl.textContent = score.toFixed(1);
                scoreEl.style.color = score > 20 ? '#33ff33' : score < -20 ? '#ff3333' : '#ffaa00';
            }

            var recoEl = document.getElementById('ia-reco' + prefix);
            if (recoEl) {
                var rec2 = data.recommendation || 'NEUTRE';
                recoEl.textContent = rec2;
                recoEl.style.color = rec2 === 'ACHAT' ? '#33ff33' : rec2 === 'VENTE' ? '#ff3333' : '#ffaa00';
            }

            var confEl = document.getElementById('ia-conf' + prefix);
            if (confEl) confEl.textContent = (data.confidence || 50).toFixed(0) + '%';

            var signals = data.signals || [];
            var signalsContainer = document.getElementById('signals-container' + prefix);
            if (signalsContainer) {
                if (signals.length === 0) {
                    signalsContainer.innerHTML = '<div class="signal-box signal-neutral"><span class="signal-icon">🟡</span><div class="signal-content"><div class="signal-title">NEUTRE</div><div class="signal-text">Aucun signal detecte</div></div></div>';
                } else {
                    var html = '';
                    signals.forEach(function(s) {
                        var cls = s.type === 'buy' ? 'signal-buy' : s.type === 'sell' ? 'signal-sell' : 'signal-neutral';
                        var icon = s.type === 'buy' ? '🟢' : s.type === 'sell' ? '🔴' : '🟡';
                        html += '<div class="signal-box ' + cls + '">';
                        html += '<span class="signal-icon">' + icon + '</span>';
                        html += '<div class="signal-content">';
                        html += '<div class="signal-title">' + s.type.toUpperCase() + ' - ' + s.indicator + '</div>';
                        html += '<div class="signal-text">' + s.message + ' (' + s.value + ')</div>';
                        html += '</div></div>';
                    });
                    signalsContainer.innerHTML = html;
                }
            }

            var signalCount = document.getElementById('signal-count' + prefix);
            if (signalCount) {
                signalCount.innerHTML = '<span class="signal-count buy">🟢 ' + (data.buy_signals || 0) + '</span> <span class="signal-count sell">🔴 ' + (data.sell_signals || 0) + '</span>';
            }

            var recoContainer = document.getElementById('recommendation-container' + prefix);
            if (recoContainer) {
                var rec3 = data.recommendation || 'NEUTRE';
                var conf = data.confidence || 50;
                var sl = data.stop_loss || 0;
                var tp = data.take_profit || 0;
                var recClass = rec3 === 'ACHAT' ? 'recommendation-buy' : rec3 === 'VENTE' ? 'recommendation-sell' : 'recommendation-neutral';
                var color3 = rec3 === 'ACHAT' ? '#33ff33' : rec3 === 'VENTE' ? '#ff3333' : '#ffaa00';
                recoContainer.innerHTML =
                    '<div class="recommendation-box ' + recClass + '">' +
                        '<div class="rec-title" style="color:' + color3 + ';">' + rec3 + '</div>' +
                        '<div class="rec-confidence">CONFIANCE: ' + conf.toFixed(0) + '%</div>' +
                        '<div style="margin-top:6px;display:flex;gap:12px;justify-content:center;font-size:0.8rem;">' +
                            '<span style="color:#ff3333;">SL: $' + sl.toFixed(2) + '</span>' +
                            '<span style="color:#33ff33;">TP: $' + tp.toFixed(2) + '</span>' +
                        '</div>' +
                    '</div>';
            }

            var preds = data.predictions || [];
            var cp = data.current_price || 0;
            for (var i = 0; i < 5; i++) {
                var el = document.getElementById('pred-' + (i + 1) + prefix);
                if (el && i < preds.length) {
                    var p = preds[i];
                    var ch = cp > 0 ? ((p - cp) / cp * 100) : 0;
                    var cc = ch > 0 ? '#33ff33' : ch < 0 ? '#ff3333' : '#ffaa00';
                    el.textContent = '$' + p.toFixed(2);
                    el.style.color = cc;
                }
            }
        }

        // ================================================================
        // CHART
        // ================================================================
        function updateChart(data, category) {
            var pd = data.data[currentPeriod] || data.data['1d'] || data.data['5d'];
            if (!pd) return;
            candlesData = pd.candles || [];
            if (candlesData.length === 0) return;

            var container = document.getElementById('chart-container-' + category);
            if (!container) return;
            container.innerHTML = '';

            if (typeof LightweightCharts === 'undefined') {
                container.innerHTML = '<div style="color:#ff3333;text-align:center;padding:20px;">Librairie non chargee</div>';
                return;
            }

            try {
                var chartInstance = LightweightCharts.createChart(container, {
                    width: container.clientWidth || 600,
                    height: 400,
                    layout: {
                        background: { color: '#0a0a0a' },
                        textColor: '#33ff33',
                        fontFamily: "'VT323', monospace"
                    },
                    grid: {
                        vertLines: { color: '#1a1a1a' },
                        horzLines: { color: '#1a1a1a' }
                    },
                    timeScale: {
                        borderColor: '#33ff33',
                        timeVisible: true,
                        secondsVisible: false
                    },
                    rightPriceScale: { borderColor: '#33ff33' }
                });

                var chartData = candlesData.map(function(c) {
                    return { time: c.time, open: c.open, high: c.high, low: c.low, close: c.close };
                });

                if (chartType === 'candle') {
                    var series = chartInstance.addCandlestickSeries({
                        upColor: '#33ff33', downColor: '#ff3333',
                        borderUpColor: '#33ff33', borderDownColor: '#ff3333',
                        wickUpColor: '#33ff33', wickDownColor: '#ff3333'
                    });
                    series.setData(chartData);
                } else {
                    var lineSeries = chartInstance.addLineSeries({ color: '#33ff33', lineWidth: 2 });
                    lineSeries.setData(chartData.map(function(c) { return { time: c.time, value: c.close }; }));
                }

                var ind = pd.indicators || {};

                if (activeIndicators.sma) {
                    if (ind.sma_20) {
                        var d = buildLineData(candlesData, ind.sma_20);
                        if (d.length > 0) {
                            var s = chartInstance.addLineSeries({ color: '#2196F3', lineWidth: 1 });
                            s.setData(d);
                        }
                    }
                    if (ind.sma_50) {
                        var d2 = buildLineData(candlesData, ind.sma_50);
                        if (d2.length > 0) {
                            var s2 = chartInstance.addLineSeries({ color: '#FF9800', lineWidth: 1 });
                            s2.setData(d2);
                        }
                    }
                }

                if (activeIndicators.ema) {
                    if (ind.ema_12) {
                        var e1 = buildLineData(candlesData, ind.ema_12);
                        if (e1.length > 0) {
                            var se1 = chartInstance.addLineSeries({ color: '#00ccff', lineWidth: 1 });
                            se1.setData(e1);
                        }
                    }
                    if (ind.ema_26) {
                        var e2 = buildLineData(candlesData, ind.ema_26);
                        if (e2.length > 0) {
                            var se2 = chartInstance.addLineSeries({ color: '#ff6b00', lineWidth: 1 });
                            se2.setData(e2);
                        }
                    }
                }

                if (activeIndicators.bb && ind.bb_upper) {
                    var bu = buildLineData(candlesData, ind.bb_upper);
                    var bl = buildLineData(candlesData, ind.bb_lower);
                    if (bu.length > 0) {
                        var sbu = chartInstance.addLineSeries({ color: '#4CAF50', lineWidth: 1, lineStyle: 2 });
                        sbu.setData(bu);
                    }
                    if (bl.length > 0) {
                        var sbl = chartInstance.addLineSeries({ color: '#4CAF50', lineWidth: 1, lineStyle: 2 });
                        sbl.setData(bl);
                    }
                }

                if (activeIndicators.volume) {
                    var volSeries = chartInstance.addHistogramSeries({
                        color: '#4488ff',
                        priceFormat: { type: 'volume' },
                        priceScaleId: 'volume'
                    });
                    volSeries.priceScale().applyOptions({ scaleMargins: { top: 0.8, bottom: 0 } });
                    volSeries.setData(candlesData.map(function(c) {
                        return {
                            time: c.time,
                            value: c.volume,
                            color: c.close >= c.open ? 'rgba(51,255,51,0.3)' : 'rgba(255,51,51,0.3)'
                        };
                    }));
                }

                chartInstance.timeScale().fitContent();
                window['chart_' + category] = chartInstance;
            } catch(e) {
                console.error('Erreur chart:', e);
                container.innerHTML = '<div style="color:#ff3333;text-align:center;padding:20px;">' + e.message + '</div>';
            }
        }

        function buildLineData(candles, data) {
            var result = [];
            for (var i = 0; i < candles.length && i < data.length; i++) {
                if (data[i] !== null && data[i] !== undefined && !isNaN(data[i])) {
                    result.push({ time: candles[i].time, value: data[i] });
                }
            }
            return result;
        }

        // ================================================================
        // CONTROLES
        // ================================================================
        function changePeriod(period) {
            currentPeriod = period;
            fetchDataForTab(currentTab);
        }

        function changeChartType(type) {
            chartType = type;
            document.querySelectorAll('[data-type]').forEach(function(b) {
                b.classList.toggle('active', b.dataset.type === type);
            });
            fetchDataForTab(currentTab);
        }

        function toggleIndicator(indicator) {
            activeIndicators[indicator] = !activeIndicators[indicator];
            var btn = document.querySelector('[data-indicator="' + indicator + '"]');
            if (btn) btn.classList.toggle('active');
            savePrefs();
            fetchDataForTab(currentTab);
        }

        function quickSelect(symbol) {
            var foundCat = null;
            for (var cat in categorySymbols) {
                if (categorySymbols[cat].indexOf(symbol) !== -1) {
                    foundCat = cat;
                    break;
                }
            }
            if (!foundCat) foundCat = currentTab;
            if (currentTab !== foundCat) {
                switchTab(foundCat);
                setTimeout(function() {
                    var input = document.getElementById('symbol-input-' + foundCat);
                    if (input) {
                        input.value = symbol;
                        fetchDataForTab(foundCat);
                    }
                }, 100);
            } else {
                var input2 = document.getElementById('symbol-input-' + foundCat);
                if (input2) {
                    input2.value = symbol;
                    fetchDataForTab(foundCat);
                }
            }
        }

        // ================================================================
        // WATCHLIST
        // ================================================================
        function refreshWatchlist(category) {
            var container = document.getElementById('watchlist-' + category);
            if (!container) return;
            container.innerHTML = 'CHARGEMENT (30-60s)...';

            fetchWithTimeout(API_BASE + '/api/watchlist', 180000)
                .then(function(data) {
                    if (!data || data.error || data.length === 0) {
                        container.innerHTML = 'INDISPONIBLE';
                        return;
                    }
                    var catName = categoryNames[category] || category;
                    var filtered = data.filter(function(item) {
                        return item.category === catName;
                    });
                    if (filtered.length === 0) filtered = data.slice(0, 10);
                    if (filtered.length === 0) {
                        container.innerHTML = 'VIDE';
                        return;
                    }
                    var html = '';
                    filtered.forEach(function(item) {
                        var cls = item.changePercent >= 0 ? 'change-positive' : 'change-negative';
                        var sign = item.changePercent >= 0 ? '+' : '';
                        html += '<div class="watchlist-item" onclick="quickSelect(\'' + item.symbol + '\')">';
                        html += '<span><span class="icon">' + (item.icon || '📈') + '</span> ' + item.symbol + '</span>';
                        html += '<span>$' + item.price.toFixed(2) + '</span>';
                        html += '</div>';
                    });
                    container.innerHTML = html;
                })
                .catch(function(err) {
                    container.innerHTML = 'TIMEOUT';
                    console.warn('Watchlist:', err.message);
                });
        }

        // ================================================================
        // RESIZE
        // ================================================================
        window.addEventListener('resize', function() {
            for (var cat in categorySymbols) {
                var container = document.getElementById('chart-container-' + cat);
                if (container && window['chart_' + cat]) {
                    try { window['chart_' + cat].resize(container.clientWidth, 400); } catch(e) {}
                }
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                var activeInput = document.activeElement;
                if (activeInput && activeInput.id && activeInput.id.indexOf('symbol-input-') === 0) {
                    var cat = activeInput.id.replace('symbol-input-', '');
                    fetchDataForTab(cat);
                }
                if (activeInput && activeInput.id === 'compare-input') {
                    runCompare();
                }
            }
        });
    </script>
</body>
